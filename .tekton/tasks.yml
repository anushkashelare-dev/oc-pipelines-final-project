apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove Python cache files from the shared source workspace.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        find . -type d -name "__pycache__" -prune -exec rm -rf {} +
        find . -type f -name "*.pyc" -delete
        echo "Workspace cleanup completed."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose-tests
spec:
  description: Run Flake8 lint checks and Python unit tests using nose.
  workspaces:
    - name: source
  steps:
    - name: lint-and-test
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --disable-pip-version-check flake8 nose
        flake8 .
        nosetests
