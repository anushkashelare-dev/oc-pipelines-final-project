apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oc-pipelines-oc-final
spec:
  workspaces:
    - name: shared-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: run-tests
      runAfter:
        - cleanup
      taskRef:
        name: nose-tests
      workspaces:
        - name: source
          workspace: shared-workspace
